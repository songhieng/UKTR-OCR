# Stage-2 data: Stage-1 sources (inherited from data.yaml, used as printed/scene replay)
# + handwriting sources. Run with --config configs/stage2_data.yaml on prepare_data.py,
# build_manifest.py and build_vocab.py --existing.
base: data.yaml
manifest: data/manifest_stage2.csv
report_dir: results/data_stage2

sources:
  # Synthetic handwriting from scripts/generate_handwriting.py (vendored khmer_synth generator).
  khmer_synth_hw:
    type: labels
    labels: data/raw/khmer_synth_hw/labels.csv
    images_root: data/raw/khmer_synth_hw
    image_column: image_path
    text_column: text
    group_column: writer_id        # writer-independent split: val/test writers never seen in training
    modality: handwritten
    val_fraction: 0.02
    test_fraction: 0.02
    license: Generated by khmer_synth (MIT) from OFL-1.1 / LGPL-3.0 Khmer fonts (derivative of font outlines).

  # REAL handwriting: line crops with official splits (download_data.py --config configs/stage2_data.yaml
  # --datasets real_hw). The val split selects checkpoints; test stays untouched for the final number.
  # To use your own lines instead: type: labels, labels/images_root/image_column/text_column/group_column
  # (writer_id) as in khmer_synth_hw above; see docs/STAGE2_MAFS.md.
  real_hw:
    hf_repo: SoyVitou/khmer-handwritten-dataset-4.2k
    revision: 69e8330835a95c1e8dcdd2454f276b3e184a2c8a
    files: [trainset.parquet, valset.parquet, testset.parquet]
    split_map: {trainset: train, valset: val, testset: test}
    modality: handwritten
    license: "HF card metadata: MIT. No writer ids, so val/test writers may also appear in train."

  # More REAL handwriting: phone photos of lined/grid notebook paper. The repo also re-hosts ~90% of
  # SoyVitou (its test split included) - those copies are dropped, ~3.6k new lines remain.
  # No official split: val/test by text hash.
  kiteaether:
    hf_repo: KiteAether/c_khmer_gemma_ocr_train
    revision: f9c236a6312ba90be08708184054eb5c07fc7a37
    files: ["data/train-*.parquet"]
    modality: handwritten
    drop_duplicates_of: [real_hw]
    val_fraction: 0.08
    test_fraction: 0.08
    license: "None stated on the HF card - ask the author before redistributing a model trained on it."

  # Thai REAL handwriting (sister script), used only as extra training data for the Khmer model
  # (configs/thai_*.yaml). BEST 2019 + Wang lines; the Wang part repeats 4,920 sentences across 2,026
  # writers, so val/test are split by text hash (sentence-disjoint). Scans up to ~9.8k px wide: saved at 64 px.
  thai_hw:
    hf_repo: iapp/thai_handwriting_dataset
    revision: 00ef1056799dfcf179927831acb4fb6ffd73a788
    files: ["train-*.parquet"]
    modality: handwritten
    max_save_height: 64
    val_fraction: 0.03
    test_fraction: 0.03
    license: "HF card metadata: apache-2.0. Sources: NECTEC BEST 2019 + Wang Thai Handwritten Free Dataset; check their terms before redistribution."
